name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # Auf main nie abbrechen – sonst gingen Releases verloren
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Balance-Dashboard
        run: npm run -s report -- runs=100 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
      - name: E2E (Playwright)
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/shots

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # vollständige Historie + Tags für den Changelog
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Das veraltete Paket 'tools' existiert in cmdline-tools 16 nicht mehr
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Version bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Major.Minor aus package.json, Patch = fortlaufende Build-Nummer
            BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
            VERSION="$BASE.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"
      - name: Web-Build + Capacitor-Sync
        run: npm run build && npx cap sync android
      - name: Signatur (Secrets überschreiben den Repo-Keystore, falls gesetzt)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: |
          # leere Secrets nicht als Passwort durchreichen
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          [ -z "$KEY_ALIAS" ] && unset KEY_ALIAS
          [ -z "$KEY_PASSWORD" ] && unset KEY_PASSWORD
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../teufelsrad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: teufelsrad-apk
          path: teufelsrad.apk
      - name: Changelog erzeugen
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          node scripts/changelog.mjs "${{ steps.ver.outputs.version }}" > release-notes.md
          # Balance-Dashboard des Builds an die Release-Notes hängen
          { echo; echo '<details><summary>⚖️ Balance-Bericht</summary>'; echo; npm run -s report -- runs=150; echo; echo '</details>'; } >> release-notes.md
          cat release-notes.md
      - name: GitHub Release (jeder Push auf main und jeder v*-Tag)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Teufelsrad v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: teufelsrad.apk
          make_latest: true
